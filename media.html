<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BreakAddict | Media</title>
  <link rel="stylesheet" href="media.css" />
</head>
<body>

  <header class="media-header">
    <h1>Media Gallery</h1>
    <p>Explore powerful stories, visuals, and tools that shed light on addiction and recovery.</p>
  </header>

  <!-- Image Gallery -->
  <section class="media-section" id="images">
    <h2>Images</h2>
    <div class="media-grid">
      <img src="images/recovery1.jpg" alt="Group Therapy Session" />
      <img src="images/addiction-impact.jpg" alt="Addiction Impact" />
      <img src="images/hope-story.jpg" alt="Hopeful Person" />
      <img src="images/stat-infographic.jpg" alt="Addiction Stats" />
    </div>
  </section>

  <!-- Video Section -->
  <section class="media-section" id="videos">
    <h2>Videos</h2>
    <div class="media-grid video-grid">
      <video controls>
        <source src="videos/story1.mp4" type="video/mp4" />
        Your browser does not support the video tag.
      </video>
      <video controls>
        <source src="videos/healing-journey.mp4" type="video/mp4" />
        Your browser does not support the video tag.
      </video>
    </div>
  </section>

  <!-- Audio Section -->
  <section class="media-section" id="audios">
    <h2>Audio Stories & Tools</h2>
    <div class="audio-list">
      <div class="audio-item">
        <h4>Guided Breathing</h4>
        <audio controls>
          <source src="audios/breathing.mp3" type="audio/mp3">
        </audio>
      </div>
      <div class="audio-item">
        <h4>Motivational Recovery Talk</h4>
        <audio controls>
          <source src="audios/recovery-talk.mp3" type="audio/mp3">
        </audio>
      </div>
    </div>
  </section>

  <!-- Infographics -->
  <section class="media-section" id="infographics">
    <h2>Infographics</h2>
    <div class="media-grid">
      <img src="images/infographic1.png" alt="Types of Addiction" />
      <img src="images/infographic2.png" alt="Addiction Recovery Stats" />
    </div>
  </section>

  <footer class="media-footer">
    <p>© 2025 BreakAddict | Media Center</p>
  </footer>

</body>
</html>
